# What `curatrix check robarm-syseng` runs (format: xdmod/curatrix/README.md, "checks.yaml").
version: 1
area: robarm-syseng

docs:                                   # CK-A6 strict docs build; its needs.json feed the graph checks
  registry: docs/documents.yaml

ids:                                    # CK-C1, CK-C2
  ledger: ids.yaml
  # Markdown files and agent material may show example IDs; they are not trace IDs.
  exclude: ["*.md", "claude/**", ".github/**"]

model:                                  # CK-E1, CK-D2 (SysML v2 Pilot), CK-B4 (variants)
  # SYSMOD and PLEML are west projects under libs/ (D84, D102). The model check can run only
  # once `west update` has fetched them. xdmod/sysml/*.sysml is always loaded first.
  # SYSMOD is not loaded yet: SYSMOD.sysml and SYSMOD15288.sysml refer to each other, and
  # curatrix loads library files one at a time, so either order gives errors. Switch the two
  # lines on (and the import in model/project.sysml) once curatrix loads libraries as one set.
  libraries:
    # - "{ws}/libs/sysmod-sysmlv2/SYSMOD15288.sysml"
    # - "{ws}/libs/sysmod-sysmlv2/SYSMOD.sysml"
    - "{ws}/libs/pleml/PLEML.sysml"
  files: [model/generated/NeedStubs.sysml, "model/*.sysml"]
  json: generated/model.json
  needs: generated/model-needs.json
  variants: true

stubs:                                  # CK-D1: SysML stubs of the needs in se-req (D42)
  out: model/generated/NeedStubs.sysml
  docs: [se-req]

views:                                  # CK-D3: views/<view>.drawio.svg match the model (D96)
  dir: views

requirements: true                      # CK-E2, CK-E3 on the system requirements
