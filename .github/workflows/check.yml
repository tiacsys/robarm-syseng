# PR check of robarm-syseng: a thin caller of xdmod's reusable workflow (xdmod/workflows/check.yml).
# It runs `curatrix check robarm-syseng --stage pr --no-cad` in a workspace built from the manifest's
# main branch, with sibling repos resolved as described in D127.
name: check
permissions:
  contents: read
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    uses: tiacsys/xdmod/.github/workflows/curatrix-check.yml@main
    with:
      manifest: tiacsys/robarm-manifest
      repo: robarm-syseng
      role: integration

  # A syseng PR also checks the full set with this branch, so a removed or changed requirement
  # shows its downstream effect before the merge (task 5.7, P4-6). Not required yet: it reports.
  downstream:
    if: github.event_name == 'pull_request'
    uses: tiacsys/xdmod/.github/workflows/curatrix-check.yml@main
    with:
      manifest: tiacsys/robarm-manifest
      repo: robarm-manifest
      role: integration
      stage: full
